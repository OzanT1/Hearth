name: hearth-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: hearth
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  app:
    profiles: ["full"]
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=hearth;Username=hearth;Password=local-development-only
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      App__PublicUrl: http://localhost:5080
      Mail__Host: mailpit
    ports: ["127.0.0.1:5080:8080"]
    volumes: ["app-data:/data"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
  app-data:
